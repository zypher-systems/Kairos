name: kairos

services:
  # ---------------------------------------------------------------- runtime
  server:
    build: .
    image: kairos-server:latest
    restart: unless-stopped
    # Host networking so the server can SSH/SFTP to machines on your LAN
    # and beyond by IP — a scheduler that can't reach its targets is not
    # much of a scheduler. KAIROS_HTTP_ADDR controls the listen port.
    network_mode: host
    environment:
      KAIROS_HTTP_ADDR: ":${KAIROS_HTTP_PORT:-8080}"
      KAIROS_DB_URL: ${KAIROS_DB_URL:-postgres://kairos:kairos@127.0.0.1:5432/kairos?sslmode=disable}
      KAIROS_DATA_DIR: /var/lib/kairos
      KAIROS_SECRET: ${KAIROS_SECRET:?set a strong KAIROS_SECRET in .env}
      KAIROS_LOG_LEVEL: ${KAIROS_LOG_LEVEL:-info}
      KAIROS_PUBLIC_URL: ${KAIROS_PUBLIC_URL:-}
      # Set KAIROS_HTTPS=true when users reach Kairos over HTTPS (usually via a
      # reverse proxy): session cookies become Secure and HSTS is sent.
      KAIROS_HTTPS: ${KAIROS_HTTPS:-false}
      # Reverse proxies whose X-Forwarded-For is trusted (IPs or CIDRs).
      KAIROS_TRUSTED_PROXIES: ${KAIROS_TRUSTED_PROXIES:-}
      TZ: ${TZ:-UTC}
    volumes:
      - kairos-data:/var/lib/kairos
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${KAIROS_HTTP_PORT:-8080}/healthz | grep -q healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  server-2:
    profiles: ["ha"]
    build: .
    image: kairos-server:latest
    restart: unless-stopped
    # Second replica on a distinct host port — host networking cannot share :8080.
    # Put a reverse proxy in front of 8080+8081 for a single URL. Same Postgres,
    # same KAIROS_SECRET, shared data volume. Followers stay up and serve HTTP.
    network_mode: host
    environment:
      KAIROS_HTTP_ADDR: ":${KAIROS_HA_HTTP_PORT:-8081}"
      KAIROS_DB_URL: ${KAIROS_DB_URL:-postgres://kairos:kairos@127.0.0.1:5432/kairos?sslmode=disable}
      KAIROS_DATA_DIR: /var/lib/kairos
      KAIROS_SECRET: ${KAIROS_SECRET:?set a strong KAIROS_SECRET in .env}
      KAIROS_LOG_LEVEL: ${KAIROS_LOG_LEVEL:-info}
      KAIROS_PUBLIC_URL: ${KAIROS_PUBLIC_URL:-}
      # Set KAIROS_HTTPS=true when users reach Kairos over HTTPS (usually via a
      # reverse proxy): session cookies become Secure and HSTS is sent.
      KAIROS_HTTPS: ${KAIROS_HTTPS:-false}
      # Reverse proxies whose X-Forwarded-For is trusted (IPs or CIDRs).
      KAIROS_TRUSTED_PROXIES: ${KAIROS_TRUSTED_PROXIES:-}
      TZ: ${TZ:-UTC}
    volumes:
      - kairos-data:/var/lib/kairos
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${KAIROS_HA_HTTP_PORT:-8081}/healthz | grep -q healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAIROS_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: kairos
      POSTGRES_DB: kairos
    volumes:
      - kairos-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos -d kairos"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------ web builds
  # One-shot builder for the SPA; HMR dev server for the frontend.
  webbuild:
    image: node:22-alpine
    profiles: ["build"]
    working_dir: /app/web
    volumes:
      - .:/app
      - web-node-modules:/app/web/node_modules

  web-dev:
    image: node:22-alpine
    profiles: ["dev"]
    working_dir: /app/web
    command: sh -c "test -f package-lock.json && npm ci --no-audit --no-fund || npm install --no-audit --no-fund; exec npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - web-node-modules:/app/web/node_modules
    environment:
      KAIROS_PROXY: http://server:8080
    ports:
      - "5173:5173"
    depends_on:
      server:
        condition: service_healthy

  # ------------------------------------------------------- dev worker agent
  # Mounts the docker socket so docker-mode jobs can run on the host.
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: kairos-agent:latest
    profiles: ["dev"]
    environment:
      # Server runs host-networked; the dev agent reaches it via the host
      # gateway. Override KAIROS_SERVER_URL if your host IP differs.
      KAIROS_SERVER_URL: ${KAIROS_AGENT_SERVER_URL:-http://host.docker.internal:8080}
      KAIROS_AGENT_TOKEN: ${KAIROS_AGENT_TOKEN:-}
      KAIROS_AGENT_NAME: ${KAIROS_AGENT_NAME:-dev-agent}
      KAIROS_AGENT_LABELS: ${KAIROS_AGENT_LABELS:-role=worker}
      KAIROS_AGENT_MAX_CONCURRENT: "2"
      KAIROS_AGENT_DEBUG: ${KAIROS_AGENT_DEBUG:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------- dev hot-reload
  # docker compose up dev  -> serves on KAIROS_HTTP_PORT with auto-rebuild
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: kairos-dev:latest
    profiles: ["dev"]
    working_dir: /src
    volumes:
      - .:/src
      - ./deploy/gitconfig:/etc/gitconfig:ro
      - go-mod-cache:/go/pkg/mod
    environment:
      KAIROS_DB_URL: postgres://kairos:kairos@postgres:5432/kairos?sslmode=disable
      KAIROS_HTTP_ADDR: ":8080"
      KAIROS_DATA_DIR: /tmp/kairos-dev
      KAIROS_SECRET: ${KAIROS_SECRET:?set a strong KAIROS_SECRET in .env}
      KAIROS_DEVELOPMENT: "true"
      KAIROS_LOG_LEVEL: ${KAIROS_LOG_LEVEL:-debug}
      GOCACHE: /tmp/gocache
    ports:
      - "${KAIROS_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # -------------------------------------------------------------- builder
  # Ephemeral tool container for tests/vet/fmt — never on the host.
  builder:
    image: golang:1.26
    profiles: ["build"]
    working_dir: /src
    volumes:
      - .:/src
      - ./deploy/gitconfig:/etc/gitconfig:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/src/.gocache
    environment:
      GOCACHE: /src/.gocache
      KAIROS_TEST_DB_URL: postgres://kairos:kairos@postgres:5432/kairos_test?sslmode=disable

volumes:
  kairos-data:
  kairos-pg:
  go-mod-cache:
  go-build-cache:
  web-node-modules: