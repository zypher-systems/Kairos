root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -buildvcs=false -o ./tmp/kairosd ./cmd/kairosd && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -o /usr/local/share/kairos/agent/kairos-agent-linux-amd64 ./cmd/kairos-agent && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -buildvcs=false -o /usr/local/share/kairos/agent/kairos-agent-linux-arm64 ./cmd/kairos-agent"
  bin = "./tmp/kairosd"
  include_ext = ["go", "sql", "toml", "yaml"]
  exclude_dir = ["tmp", "bin", "web", ".git", "data"]
  exclude_regex = ["_test\\.go$"]
  delay = 800

[log]
  time = true

[misc]
  clean_on_exit = true